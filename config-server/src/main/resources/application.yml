server:
  port: 8888

spring:
  cloud:
    config:
      server:
        git:
          uri: https://github.com/KishanUtkarsh/vehicle-service-config-info


  application:
    name: CONFIG-SERVER

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

